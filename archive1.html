<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IronBrew0 • Report Viewer</title>
<style>
:root{
  --bg:#0a0b0e;--bg-1:#0e1014;--bg-2:#13161c;--bg-3:#1a1e26;
  --border:#232833;--border-2:#2e3440;
  --text:#e6e9ef;--text-dim:#8b93a3;--text-mute:#5b6273;
  --accent:#ff7a1a;--accent-2:#ffb347;--accent-bg:rgba(255,122,26,.12);
  --green:#4ade80;--red:#f87171;--blue:#60a5fa;--purple:#c084fc;--pink:#f472b6;--yellow:#fbbf24;
  --mono:"JetBrains Mono","Cascadia Code","Fira Code","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{height:56px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#101318 0%,#0c0e12 100%);flex-shrink:0;gap:14px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#0a0b0e;box-shadow:0 0 16px rgba(255,122,26,.35)}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo i{color:var(--text-dim);font-style:normal;font-weight:500;font-size:13px}
.status-pill{margin-left:auto;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--bg-2);border:1px solid var(--border);font-size:12px;color:var(--text-dim);font-family:var(--mono)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-mute);box-shadow:0 0 8px currentColor}
.status-pill.ok .status-dot{background:var(--green);color:var(--green)}
.status-pill.err .status-dot{background:var(--red);color:var(--red)}
.status-pill.load .status-dot{background:var(--yellow);color:var(--yellow);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.layout{display:grid;grid-template-columns:280px 1fr;flex:1;min-height:0}
aside{border-right:1px solid var(--border);background:var(--bg-1);display:flex;flex-direction:column;min-height:0}
.sidebar-head{padding:12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-mute);pointer-events:none}
#search{width:100%;padding:9px 11px 9px 32px;border:1px solid var(--border-2);border-radius:8px;background:var(--bg-2);color:var(--text);font-size:13px;outline:none;transition:border-color .15s,background .15s}
#search:focus{border-color:var(--accent);background:var(--bg-3)}
#search::placeholder{color:var(--text-mute)}
.stats-row{display:flex;gap:8px;font-size:11px;color:var(--text-dim);font-family:var(--mono)}
.stat-chip{flex:1;padding:5px 8px;border-radius:6px;background:var(--bg-2);border:1px solid var(--border);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-chip b{color:var(--accent);font-weight:700}
.tree{flex:1;overflow-y:auto;padding:8px 6px 20px}
.tree::-webkit-scrollbar,.content::-webkit-scrollbar,.code-area::-webkit-scrollbar{width:9px;height:9px}
.tree::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.code-area::-webkit-scrollbar-thumb{background:#2a303b;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
.tree::-webkit-scrollbar-thumb:hover,.content::-webkit-scrollbar-thumb:hover,.code-area::-webkit-scrollbar-thumb:hover{background:#39414f;background-clip:padding-box}
.tree-node{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;cursor:pointer;color:var(--text-dim);font-size:12.5px;user-select:none;white-space:nowrap;overflow:hidden;transition:background .1s,color .1s}
.tree-node:hover{background:var(--bg-3);color:var(--text)}
.tree-node.active{background:var(--accent-bg);color:var(--accent);border-left:2px solid var(--accent);padding-left:7px}
.tree-node .label{overflow:hidden;text-overflow:ellipsis;flex:1}
.tree-node .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.tree-cat{padding:12px 9px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute)}
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.toolbar{height:48px;padding:0 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg-1);flex-shrink:0}
.crumb{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.crumb b{color:var(--text);font-weight:600}
.btn{border:1px solid var(--border-2);background:var(--bg-2);color:var(--text);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:12px;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--bg-3);border-color:#3a4150}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#0a0b0e;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.content{flex:1;overflow:auto;min-height:0}
.home{padding:26px;max-width:1100px;margin:0 auto}
.hero{padding:22px 24px;border-radius:12px;background:linear-gradient(135deg,rgba(255,122,26,.10) 0%,rgba(255,179,71,.03) 60%,transparent 100%);border:1px solid rgba(255,122,26,.22);margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.3px}
.hero p{margin:0;color:var(--text-dim);font-size:13px;line-height:1.55}
.grid-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.meta-card{padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-1);transition:border-color .15s,transform .15s}
.meta-card:hover{border-color:var(--border-2);transform:translateY(-1px)}
.meta-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute);margin-bottom:6px;font-weight:600}
.meta-value{font-size:16px;font-weight:600;font-family:var(--mono);color:var(--text);word-break:break-word}
.meta-value.accent{color:var(--accent)}
.section-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:1px;background:var(--border)}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.file-card{padding:13px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-1);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.file-card:hover{background:var(--bg-2);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px -8px rgba(255,122,26,.25)}
.file-card-top{display:flex;align-items:center;gap:8px}
.file-ext{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--bg-3);color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border)}
.file-ext.lua,.file-ext.luau{color:var(--blue);border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.08)}
.file-ext.py{color:var(--yellow);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.file-ext.js,.file-ext.ts,.file-ext.jsx,.file-ext.tsx{color:var(--yellow);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.file-ext.json,.file-ext.yaml,.file-ext.yml,.file-ext.toml{color:var(--purple);border-color:rgba(192,132,252,.3);background:rgba(192,132,252,.08)}
.file-ext.sh,.file-ext.bat,.file-ext.ps1{color:var(--green);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08)}
.file-ext.html,.file-ext.css,.file-ext.xml{color:var(--pink);border-color:rgba(244,114,182,.3);background:rgba(244,114,182,.08)}
.file-ext.env{color:var(--accent);border-color:rgba(255,122,26,.3);background:rgba(255,122,26,.08)}
.file-path{font-size:12.5px;color:var(--text);word-break:break-all;line-height:1.35;font-family:var(--mono)}
.file-size{font-size:11px;color:var(--text-mute);font-family:var(--mono)}
.preview-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.preview-head{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--bg-1);display:flex;align-items:center;gap:10px;flex-shrink:0}
.preview-head .path{font-family:var(--mono);font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.preview-head .badge{font-size:10.5px;font-family:var(--mono);padding:3px 8px;border-radius:5px;background:var(--bg-3);color:var(--text-dim);border:1px solid var(--border)}
.code-area{flex:1;min-height:0;overflow:auto;background:#08090c}
.code-table{display:table;width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.code-row{display:table-row}
.code-row:hover{background:rgba(255,255,255,.02)}
.line-no{display:table-cell;width:1%;padding:0 14px 0 18px;text-align:right;color:#3d4351;user-select:none;white-space:nowrap;border-right:1px solid var(--border);vertical-align:top;position:sticky;left:0;background:#08090c}
.line-code{display:table-cell;padding:0 20px;color:#cdd3dd;white-space:pre;word-break:normal;tab-size:4}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;color:var(--text-dim)}
.empty-state .icon{font-size:42px;margin-bottom:14px;opacity:.4}
.empty-state h2{margin:0 0 8px;color:var(--text);font-size:17px}
.empty-state p{margin:0;font-size:13px;max-width:420px;line-height:1.6}
.error-box{max-width:620px;margin:60px auto;padding:20px 22px;border:1px solid rgba(248,113,113,.35);border-radius:12px;background:rgba(248,113,113,.05)}
.error-box h3{margin:0 0 10px;color:var(--red);font-size:15px}
.error-box pre{margin:0;padding:12px;background:#0a0b0e;border:1px solid var(--border);border-radius:8px;font-family:var(--mono);font-size:12px;color:#e6b0b0;white-space:pre-wrap;word-break:break-word}
.menu-toggle{display:none;background:none;border:1px solid var(--border-2);border-radius:7px;color:var(--text);width:34px;height:34px;cursor:pointer;align-items:center;justify-content:center}
@media(max-width:780px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;top:56px;bottom:0;left:0;width:280px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:20px 0 40px rgba(0,0,0,.5)}
  aside.open{transform:translateX(0)}
  .menu-toggle{display:inline-flex}
  .file-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="logo">
    <div class="logo-mark">IB</div>
    <b>IronBrew0</b>
    <i>Report Viewer</i>
  </div>
  <div class="status-pill load" id="statusPill">
    <span class="status-dot"></span>
    <span id="statusText">Loading…</span>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="sidebar-head">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search paths…" autocomplete="off" spellcheck="false">
      </div>
      <div class="stats-row">
        <div class="stat-chip" id="statFiles">— files</div>
        <div class="stat-chip" id="statBytes">— B</div>
      </div>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="crumb" id="crumb"><span>Report</span></div>
      <button class="btn" id="copyBtn" style="display:none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        Copy
      </button>
      <button class="btn primary" id="dlBtn" style="display:none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        Download
      </button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
"use strict";

/* ============================================================
   Decoders — supports four payload formats:
     0) "path|content"                  (new minimal flow)
     1) Plain JSON                      ({"path":"content"})
     2) base64url -> zlib -> binary     (older harvester)
     3) base85 -> Pastefy URL -> base64url -> zlib -> binary
   ============================================================ */

function b64urlToBytes(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function inflateZlib(bytes){
  const body = bytes.subarray(2, bytes.length-4);
  if (typeof DecompressionStream !== "function")
    throw new Error("No DecompressionStream");
  const stream = new Blob([body]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function base85Decode(input){
  input = String(input||"").trim();
  if (!input) throw new Error("Empty Base85 payload.");
  const out = []; let block = [];
  for (let i=0;i<input.length;i++){
    const c = input.charCodeAt(i);
    if (c<33||c>117) continue;
    block.push(c-33);
    if (block.length===5){
      const v = block[0]*52200625+block[1]*614125+block[2]*7225+block[3]*85+block[4];
      out.push((v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255);
      block = [];
    }
  }
  if (block.length){
    const origLen = block.length;
    while (block.length<5) block.push(84);
    const v = block[0]*52200625+block[1]*614125+block[2]*7225+block[3]*85+block[4];
    const tmp = [(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255];
    for (let i=0;i<origLen-1;i++) out.push(tmp[i]);
  }
  return new TextDecoder("utf-8",{fatal:false}).decode(new Uint8Array(out));
}

function parseContainer(bytes){
  if (bytes[0] !== 0x01) throw new Error("Not a binary container (bad magic).");
  let off = 1;
  const numFiles = (bytes[off]<<8) | bytes[off+1]; off += 2;
  const execLen  = bytes[off]; off += 1;
  const executor = new TextDecoder().decode(bytes.subarray(off, off+execLen)); off += execLen;

  const files = [];
  for (let i=0;i<numFiles;i++){
    const pathLen = (bytes[off]<<8) | bytes[off+1]; off += 2;
    const path = new TextDecoder().decode(bytes.subarray(off, off+pathLen)); off += pathLen;
    const contentLen =
      ((bytes[off]<<24) | (bytes[off+1]<<16) | (bytes[off+2]<<8) | bytes[off+3]) >>> 0;
    off += 4;
    const content = new TextDecoder("utf-8",{fatal:false}).decode(bytes.subarray(off, off+contentLen));
    off += contentLen;
    files.push({ path, content, size: contentLen, type: "text" });
  }
  return {
    version: 1,
    executor,
    files,
    stats: { included: files.length, bytes: files.reduce((s,f)=>s+f.size,0) }
  };
}

function fromPlainObject(obj){
  const files = [];
  for (const path of Object.keys(obj)) {
    const content = String(obj[path] ?? "");
    files.push({ path, content, size: content.length, type: "text" });
  }
  return {
    version: 1,
    executor: "Unknown",
    files,
    stats: { included: files.length, bytes: files.reduce((s,f)=>s+f.size,0) }
  };
}

/* ============================================================
   Helpers
   ============================================================ */

function formatBytes(n){
  n = Number(n)||0;
  if (n<1024) return n+" B";
  if (n<1024*1024) return (n/1024).toFixed(1)+" KB";
  if (n<1024*1024*1024) return (n/1024/1024).toFixed(2)+" MB";
  return (n/1024/1024/1024).toFixed(2)+" GB";
}
function escapeHTML(v){
  return String(v)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function extOf(path){
  const base = String(path).split("/").pop() || "";
  const m = base.toLowerCase().match(/\.([a-z0-9]+)$/);
  if (m) return m[1];
  if (base.startsWith(".")) return base.slice(1).split(".")[0] || "env";
  return "";
}
function fileColor(path){
  const e = extOf(path);
  const map = {
    lua:"#60a5fa",luau:"#60a5fa",py:"#fbbf24",
    js:"#fbbf24",ts:"#60a5fa",jsx:"#f472b6",tsx:"#60a5fa",
    json:"#c084fc",yaml:"#c084fc",yml:"#c084fc",toml:"#c084fc",
    md:"#8b93a3",txt:"#8b93a3",
    sh:"#4ade80",bat:"#4ade80",ps1:"#4ade80",cmd:"#4ade80",
    html:"#f472b6",htm:"#f472b6",css:"#f472b6",xml:"#f472b6",
    rs:"#ff7a1a",c:"#60a5fa",cpp:"#60a5fa",h:"#60a5fa",hpp:"#60a5fa",
    go:"#60a5fa",rb:"#f87171",php:"#c084fc",
    env:"#ff7a1a"
  };
  return map[e] || "#8b93a3";
}

/* ============================================================
   State
   ============================================================ */

let report = null;
let allFiles = [];
let currentFile = null;

const $ = (id) => document.getElementById(id);

function setStatus(text, cls){
  $("statusText").textContent = text;
  const pill = $("statusPill");
  pill.classList.remove("ok","err","load");
  pill.classList.add(cls || "ok");
}

function normalizeReport(data){
  if (!data || typeof data !== "object") throw new Error("Invalid report.");
  if (!Array.isArray(data.files)) data.files = [];
  data.files = data.files
    .filter(f => f && typeof f === "object")
    .map(f => ({
      path: String(f.path || ""),
      size: Number(f.size || 0),
      content: String(f.content || ""),
      type: String(f.type || "text")
    }))
    .filter(f => f.path);
  return data;
}

/* ============================================================
   Load report
   ============================================================ */
async function loadReport(){
  const params = new URLSearchParams(location.search);
  const encoded = params.get("result");

  if (!encoded){
    setStatus("No payload","err");
    $("content").innerHTML = `
      <div class="empty-state">
        <div class="icon">🛰️</div>
        <h2>No report supplied</h2>
        <p>Open this page with a <code>?result=…</code> payload.</p>
      </div>`;
    return;
  }

  setStatus("Decoding…","load");

  try {
    let data = null;
    const trimmed = encoded.trim();

    /* ---------- Format #0: "path|content" (may repeat) ---------- */
    if (trimmed.includes("|")) {
      const parts = trimmed.split("|");
      const files = [];
      // Pair up: path, content, path, content, ...
      for (let i = 0; i + 1 < parts.length; i += 2) {
        const path = parts[i];
        const content = parts[i + 1];
        files.push({ path, content, size: content.length, type: "text" });
      }

      // If odd count, last "path" has no content — treat as empty file
      if (parts.length % 2 === 1 && parts.length > 1) {
        const path = parts[parts.length - 1];
        if (path) files.push({ path, content: "", size: 0, type: "text" });
      }

      data = {
        version: 1,
        executor: "Unknown",
        files,
        stats: { included: files.length, bytes: files.reduce((s,f)=>s+f.size,0) }
      };
    }

    /* ---------- Format #1: plain JSON ---------- */
    if (!data && trimmed.startsWith("{")) {
      try {
        const parsed = JSON.parse(trimmed);
        data = parsed && Array.isArray(parsed.files)
          ? parsed
          : fromPlainObject(parsed);
      } catch (e) {
        console.warn("Plain JSON parse failed:", e);
      }
    }

    /* ---------- Format #2: base64url -> zlib -> binary ---------- */
    if (!data) {
      try {
        const bytes = await inflateZlib(b64urlToBytes(trimmed));
        if (bytes[0] === 0x01) {
          data = parseContainer(bytes);
        } else {
          const text = new TextDecoder("utf-8",{fatal:false}).decode(bytes);
          const parsed = JSON.parse(text);
          data = Array.isArray(parsed.files) ? parsed : fromPlainObject(parsed);
        }
      } catch (_) { /* not this format */ }
    }

    /* ---------- Format #3: base85 -> Pastefy URL ---------- */
    if (!data) {
      try {
        const guess = base85Decode(decodeURIComponent(encoded)).trim();
        if (/^https?:\/\//i.test(guess)) {
          setStatus("Fetching…","load");
          const resp = await fetch(guess, { cache: "no-store" });
          if (!resp.ok) throw new Error("Fetch failed: " + resp.status);
          const b64 = (await resp.text()).trim();
          const bytes = await inflateZlib(b64urlToBytes(b64));
          if (bytes[0] === 0x01) {
            data = parseContainer(bytes);
          } else {
            const text = new TextDecoder("utf-8",{fatal:false}).decode(bytes);
            const parsed = JSON.parse(text);
            data = Array.isArray(parsed.files) ? parsed : fromPlainObject(parsed);
          }
        }
      } catch (_) { /* not this format */ }
    }

    if (!data) throw new Error("Unrecognized payload format.");

    report = normalizeReport(data);
    allFiles = report.files;

    setStatus(`${allFiles.length} files`,"ok");
    $("statFiles").innerHTML = `<b>${allFiles.length}</b> files`;
    $("statBytes").innerHTML = `<b>${formatBytes(allFiles.reduce((s,f)=>s+f.size,0))}</b>`;

    buildTree();
    showHome();
  } catch (err){
    console.error(err);
    setStatus("Decode failed","err");
    $("content").innerHTML = `
      <div class="error-box">
        <h3>Could not decode payload</h3>
        <pre>${escapeHTML(err && err.message ? err.message : String(err))}</pre>
      </div>`;
  }
}

/* ============================================================
   Sidebar
   ============================================================ */

function buildTree(){
  const tree = $("tree");
  tree.innerHTML = "";

  if (!allFiles.length){
    tree.innerHTML = `<div class="tree-cat">No files</div>`;
    return;
  }

  const sorted = [...allFiles].sort((a,b)=>a.path.localeCompare(b.path));

  const home = document.createElement("div");
  home.className = "tree-node";
  home.innerHTML = `<span class="dot" style="color:var(--accent);background:var(--accent)"></span><span class="label">Overview</span>`;
  home.onclick = () => { setActiveNode(home); showHome(); };
  home.dataset.home = "1";
  tree.appendChild(home);

  const cat = document.createElement("div");
  cat.className = "tree-cat";
  cat.textContent = `Files (${sorted.length})`;
  tree.appendChild(cat);

  for (const file of sorted){
    const node = document.createElement("div");
    node.className = "tree-node";
    node.dataset.path = file.path.toLowerCase();
    const color = fileColor(file.path);
    node.innerHTML = `<span class="dot" style="color:${color};background:${color}"></span><span class="label" title="${escapeHTML(file.path)}">${escapeHTML(file.path)}</span>`;
    node.onclick = () => { setActiveNode(node); showFile(file); };
    tree.appendChild(node);
  }
}

function setActiveNode(node){
  document.querySelectorAll(".tree-node.active").forEach(n => n.classList.remove("active"));
  if (node) node.classList.add("active");
}

/* ============================================================
   Home
   ============================================================ */

function showHome(){
  currentFile = null;
  document.querySelectorAll(".tree-node.active").forEach(n => n.classList.remove("active"));
  const home = document.querySelector('.tree-node[data-home="1"]');
  if (home) home.classList.add("active");

  $("crumb").innerHTML = `<span>Report</span>`;
  $("copyBtn").style.display = "none";
  $("dlBtn").style.display = "none";

  const meta = report || {};
  const totalBytes = allFiles.reduce((s,f)=>s+f.size,0);
  const totalLines = allFiles.reduce((s,f)=>s + (f.content.match(/\n/g)||[]).length + 1, 0);

  let cardsHTML = "";
  if (allFiles.length){
    const sorted = [...allFiles].sort((a,b)=>a.path.localeCompare(b.path));
    cardsHTML = sorted.map(f => {
      const e = extOf(f.path) || "file";
      return `
        <div class="file-card" data-path="${escapeHTML(f.path)}">
          <div class="file-card-top">
            <span class="file-ext ${escapeHTML(e)}">${escapeHTML(e)}</span>
          </div>
          <div class="file-path">${escapeHTML(f.path)}</div>
          <div class="file-size">${formatBytes(f.size)}</div>
        </div>`;
    }).join("");
  }

  $("content").innerHTML = `
    <div class="home">
      <div class="hero">
        <h1>IronBrew0 Report</h1>
        <p>Local file dump decoded from the URL payload. Click any card or sidebar entry to preview its contents.</p>
      </div>

      <div class="grid-meta">
        <div class="meta-card">
          <div class="meta-label">Files</div>
          <div class="meta-value accent">${allFiles.length}</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">Total size</div>
          <div class="meta-value">${formatBytes(totalBytes)}</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">Total lines</div>
          <div class="meta-value">${totalLines.toLocaleString()}</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">Executor</div>
          <div class="meta-value">${escapeHTML(meta.executor || "Unknown")}</div>
        </div>
      </div>

      ${allFiles.length
        ? `<h2 class="section-title">Files</h2><div class="file-grid">${cardsHTML}</div>`
        : `<div class="empty-state"><div class="icon">📭</div><h2>No files</h2><p>The report contained no readable entries.</p></div>`}
    </div>`;

  document.querySelectorAll(".file-card").forEach(card => {
    card.onclick = () => {
      const p = card.getAttribute("data-path");
      const f = allFiles.find(x => x.path === p);
      if (f){
        const node = [...document.querySelectorAll('.tree-node[data-path]')]
          .find(n => n.dataset.path === f.path.toLowerCase());
        if (node) setActiveNode(node);
        showFile(f);
      }
    };
  });
}

/* ============================================================
   File preview
   ============================================================ */

function showFile(file){
  currentFile = file;

  $("crumb").innerHTML = `<span style="color:var(--accent)">◆</span> <b>${escapeHTML(file.path)}</b>`;
  $("copyBtn").style.display = "";
  $("dlBtn").style.display = "";

  const lines = file.content.split(/\r?\n/);
  const gutterWidth = String(lines.length).length;
  const rows = new Array(lines.length);
  for (let i=0;i<lines.length;i++){
    const n = String(i+1).padStart(gutterWidth," ");
    rows[i] = `<div class="code-row"><div class="line-no">${n}</div><div class="line-code">${escapeHTML(lines[i]) || " "}</div></div>`;
  }

  $("content").innerHTML = `
    <div class="preview-wrap">
      <div class="preview-head">
        <span class="badge">${escapeHTML(extOf(file.path) || "txt")}</span>
        <div class="path">${escapeHTML(file.path)}</div>
        <span class="badge">${formatBytes(file.size)}</span>
        <span class="badge">${lines.length} lines</span>
      </div>
      <div class="code-area">
        <div class="code-table">${rows.join("")}</div>
      </div>
    </div>`;
}

/* ============================================================
   Toolbar actions
   ============================================================ */

$("copyBtn").onclick = async () => {
  if (!currentFile) return;
  try {
    await navigator.clipboard.writeText(currentFile.content);
    $("copyBtn").innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg> Copied`;
    setTimeout(() => {
      $("copyBtn").innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> Copy`;
    }, 1400);
  } catch (e){ console.warn(e); }
};

$("dlBtn").onclick = () => {
  if (!currentFile) return;
  const blob = new Blob([currentFile.content], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = currentFile.path.split("/").pop() || "file.txt";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

/* ============================================================
   Search + mobile
   ============================================================ */

$("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.tree-node[data-path]').forEach(node => {
    node.style.display = (!q || node.dataset.path.includes(q)) ? "" : "none";
  });
});

$("menuToggle").onclick = () => $("sidebar").classList.toggle("open");
document.querySelector("main").addEventListener("click", () => $("sidebar").classList.remove("open"));

/* ============================================================
   Go
   ============================================================ */

loadReport();
</script>

</body>
</html>
